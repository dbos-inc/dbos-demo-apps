[project]
name = "interops"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    # test suite
    "pytest",
    "requests",
    "psycopg[binary]",
    # interop-python app (published SDK, mirrors apps/interop-python/requirements.txt).
    # Tracks the latest release: older ones can't dequeue workflows that the
    # tip-of-main TypeScript and Go SDKs enqueue.
    "dbos>=3.1.0",
    "fastapi[standard]",
    "uvicorn[standard]",
]
