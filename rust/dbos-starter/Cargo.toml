# The Workflows, Schedules, Queues, Events and Messages tabs of the DBOS starter app: launch a
# workflow, crash the process, restart, and watch it resume at the step after the last one that
# finished — then fan five workflows onto a queue that runs three at a time, and change that limit
# without restarting.
[package]
name = "dbos-rust-starter"
description = "DBOS Rust starter app"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
dbos = "0.6"

axum = "0.8"
# `signal` for the Ctrl-C that ends the serve loop, so `shutdown` is reached rather than skipped.
# `sync` for the mutex guarding the queue demo's handles, which is held across an await.
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
# Derives only, for the Queues tab's JSON request and response bodies.
serde = { version = "1", features = ["derive"] }
tracing-subscriber = "0.3"

[dev-dependencies]
# Each test drops its database first, so nothing an earlier run left behind is recovered. The same
# driver and version the SDK uses.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
# The tests read the routes' JSON responses.
serde_json = "1"
# `oneshot`, so the tests can call the router without binding a port.
tower = { version = "0.5", features = ["util"] }

# Stands alone: this repository has no Cargo workspace.
[workspace]
