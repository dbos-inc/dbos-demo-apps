# Advanced queue patterns: fair queueing, rate limits and debouncing, each with a live view of its
# workflows. Serves the same frontend as the other languages' versions of this app.
[package]
name = "dbos-rust-queue-patterns"
description = "DBOS Rust queue patterns demo"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Tracks the SDK's main until 0.6 is on crates.io. Replace with `dbos = "0.6"` when it is.
dbos = { git = "https://github.com/dbos-inc/dbos-transact-rust", branch = "main" }

axum = "0.8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
# To read a debounced workflow's input back out of the row it was listed from.
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
# Serves the built frontend.
tower-http = { version = "0.6", features = ["fs"] }
tracing-subscriber = "0.3"

# Stands alone: this repository has no Cargo workspace.
[workspace]
