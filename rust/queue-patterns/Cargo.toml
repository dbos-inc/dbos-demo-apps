# Advanced queue patterns: fair queueing, rate limits and debouncing, each with a live view of its
# workflows. Serves the same frontend as the other languages' versions of this app.
[package]
name = "dbos-rust-queue-patterns"
description = "DBOS Rust queue patterns demo"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
dbos = "0.6"

axum = "0.8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
# To read a debounced workflow's input back out of the row it was listed from.
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
# Serves the built frontend.
tower-http = { version = "0.6", features = ["fs"] }
tracing-subscriber = "0.3"

[dev-dependencies]
# `oneshot`, so the tests can call the router without binding a port.
tower = { version = "0.5", features = ["util"] }

# Stands alone: this repository has no Cargo workspace.
[workspace]
