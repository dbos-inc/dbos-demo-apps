name: CI for Python Reliable Refunds (LangChain)

on:
  push:
    branches: [ "main" ]
    paths:
        - 'python/reliable-refunds-langchain/**'
        - '.github/workflows/python-reliable-refunds-langchain.yml'
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
    paths:
      - 'python/reliable-refunds-langchain/**'
      - '.github/workflows/python-reliable-refunds-langchain.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Service container for Postgres
    services:
      # Label used to access the service container.
      pgtest:
        image: postgres:16
        env:
          # Specify the password for Postgres superuser.
          POSTGRES_PASSWORD: dbos
        # Set health checks to wait until postgres has started
        options: >-
          --name pgtest
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - name: Checkout demo app
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: uv sync
        working-directory: python/reliable-refunds-langchain

      # Runs the SQLite and Postgres integration tests. The model is mocked,
      # so no OpenAI or SendGrid credentials are needed.
      - name: Run Tests
        run: uv run python -m unittest -v
        working-directory: python/reliable-refunds-langchain
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:dbos@localhost:5432/postgres
