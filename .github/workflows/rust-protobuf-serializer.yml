name: CI for Rust protobuf-serializer

on:
  push:
    branches: [ "main" ]
    paths:
      - 'rust/protobuf-serializer/**'
      - '.github/workflows/rust-protobuf-serializer.yml'
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
    paths:
      - 'rust/protobuf-serializer/**'
      - '.github/workflows/rust-protobuf-serializer.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create database
        run: PGPASSWORD=dbos psql -h localhost -U postgres -c "CREATE DATABASE protobuf_serializer_test"

      - name: Build and test
        working-directory: rust/protobuf-serializer/
        run: |
          cargo build --locked
          cargo test --locked
        env:
          PGPASSWORD: dbos
          DBOS_SYSTEM_DATABASE_URL: postgres://postgres:dbos@localhost:5432/protobuf_serializer_test?sslmode=disable
