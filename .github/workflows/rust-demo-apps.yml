name: CI for Rust Demo Apps

on:
  push:
    branches: [ "main" ]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-demo-apps.yml'
  pull_request:
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
    paths:
      - 'rust/**'
      - '.github/workflows/rust-demo-apps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - dbos-starter
          - queue-patterns
          - widget-store

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: rust/${{ matrix.app }}

    env:
      RUSTFLAGS: -D warnings
      # Each test creates and uses a database of its own, named after this one.
      DBOS_SYSTEM_DATABASE_URL: postgres://postgres:dbos@localhost:5432/dbos_rust_ci

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
